<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞机大战</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div id="startScreen" class="screen">
            <h1 class="game-title">飞机大战</h1>
            <p class="instruction">使用鼠标或方向键移动飞机</p>
            <p class="instruction">自动发射子弹</p>
            <button id="startBtn" class="btn">开始游戏</button>
        </div>
        
        <div id="gameScreen" class="screen hidden">
            <div class="score-board">
                <span>分数: <span id="score">0</span></span>
            </div>
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <div id="gameOverScreen" class="screen hidden">
            <h2 class="game-over-title">游戏结束</h2>
            <p class="final-score">最终分数: <span id="finalScore">0</span></p>
            <button id="restartBtn" class="btn">重新开始</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
